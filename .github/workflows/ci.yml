name: TENSORGRAPH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fx]"

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            tensorgraph \
            tests \
            examples \
            benchmarks/bench_verified_elementwise.py \
            benchmarks/bench_six_baseline_elementwise.py

      - name: Lint recovery surface
        run: |
          ruff check \
            tensorgraph/signature.py \
            tensorgraph/ir/primitives.py \
            tensorgraph/egraph/egraph.py \
            tensorgraph/egraph/saturation.py \
            tensorgraph/dist \
            tensorgraph/pipeline \
            tests/test_recovery_semantics.py \
            tests/test_verified_pipeline.py \
            tests/test_six_baseline_benchmark.py \
            benchmarks/bench_verified_elementwise.py \
            benchmarks/bench_six_baseline_elementwise.py \
            scripts/check_evidence_claims.py

      - name: Type check recovery surface
        if: matrix.python-version == '3.10'
        run: |
          mypy \
            tensorgraph/signature.py \
            tensorgraph/ir/primitives.py \
            tensorgraph/egraph/egraph.py \
            tensorgraph/egraph/saturation.py \
            tensorgraph/dist \
            tensorgraph/pipeline

      - name: Enforce evidence and claim policy
        run: python scripts/check_evidence_claims.py

      - name: Run full unit suite
        run: pytest tests -v --cov=tensorgraph

      - name: Run saturation smoke benchmark
        run: python benchmarks/bench_saturation.py

  gpu-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GPU benchmarks fail closed without CUDA
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,fx]"

          set +e
          python benchmarks/bench_verified_elementwise.py \
            --terminal-op sigmoid \
            --sizes 16 \
            --warmup 0 \
            --repetitions 1 \
            --output /tmp/verified-evidence.json
          verified_status=$?

          python benchmarks/bench_six_baseline_elementwise.py \
            --sizes 16 \
            --dtypes float32 \
            --warmup 0 \
            --repetitions 1 \
            --output /tmp/six-baseline-evidence.json
          matrix_status=$?
          set -e

          test "$verified_status" -ne 0
          test "$matrix_status" -ne 0
          test ! -e /tmp/verified-evidence.json
          test ! -e /tmp/six-baseline-evidence.json
          test ! -e /tmp/six-baseline-evidence.csv
