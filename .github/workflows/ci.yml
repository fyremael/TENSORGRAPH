name: TENSORGRAPH CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,fx]"

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        # Then exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        ruff check tensorgraph tests

    - name: Type check with Mypy
      run: |
        mypy tensorgraph

    - name: Run Tests
      run: |
        pytest tests -v --cov=tensorgraph

    - name: Run Saturation Benchmark
      run: |
        python benchmarks/bench_saturation.py
